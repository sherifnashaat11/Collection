<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>قراءة العداد</title>
<style>
  :root {
    --primary: #0a6fb0;
    --bg: #f4f7fa;
    --card: #ffffff;
    --ink: #0c2233;
    --line: #d3dde4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0a1722; --card: #1a2f42; --ink: #e7eff5; --line: #2a4257; --primary: #4fa8e8;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100dvh;
    overflow: hidden; /* إلغاء الـ Scroll نهائياً */
    background: var(--bg);
    color: var(--ink);
    font-family: 'Segoe UI', Tahoma, sans-serif;
  }
  .app-container {
    display: flex;
    flex-direction: column;
    height: 100%;
    max-width: 420px;
    margin: 0 auto;
    padding: 15px;
  }
  .header-info {
    text-align: center;
    margin-bottom: 15px;
  }
  .header-info h1 { font-size: 1.2rem; color: var(--primary); font-weight: 800; }
  .header-info p { font-size: 0.85rem; color: #5b6f7d; margin-top: 5px; line-height: 1.4; }
  
  .form-group {
    background: var(--card);
    padding: 20px;
    border-radius: 16px;
    border: 1.5px solid var(--line);
    display: flex;
    flex-direction: column;
    gap: 15px;
    flex: 1;
    justify-content: center;
  }
  label { font-weight: 700; font-size: 0.9rem; margin-bottom: 5px; display: block; }
  input {
    width: 100%;
    padding: 12px;
    border: 2px solid var(--line);
    border-radius: 10px;
    font-size: 1.5rem;
    font-weight: 800;
    text-align: center;
    color: var(--primary);
    font-family: inherit;
    background: var(--bg);
    direction: ltr;
  }
  input:focus { outline: none; border-color: var(--primary); }
  input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number] { -moz-appearance: textfield; }

  .actions {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 15px;
  }
  button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    font-size: 1.1rem;
    font-weight: 800;
    cursor: pointer;
    font-family: inherit;
    transition: 0.2s;
  }
  button:active { transform: scale(0.97); }
  #saveBtn { background: var(--primary); color: #fff; }
  #exportBtn { background: transparent; color: var(--primary); border: 2px solid var(--primary); }
</style>
</head>
<body>
<div class="app-container">
  <div class="header-info">
    <h1>قراءة العداد</h1>
    <p id="clientInfo">جاري التحميل...</p>
  </div>

  <div class="form-group">
    <div>
      <label>القراءة الحالية (بحد أقصى 5 أرقام)</label>
      <input id="v" type="number" maxlength="5" inputmode="numeric" autocomplete="off" placeholder="00000">
    </div>
    <div>
      <label>ملاحظة (اختياري)</label>
      <input id="n" type="text" autocomplete="off" placeholder="أضف ملاحظة..." style="font-size: 1rem; font-weight: 600; text-align: right; direction: rtl;">
    </div>
  </div>

  <div class="actions">
    <button id="saveBtn">حفظ القراءة</button>
    <button id="exportBtn">تصدير كل القراءات (CSV)</button>
  </div>
</div>

<script>
  const p = new URLSearchParams(location.search);
  const k = p.get('k') || '';
  const KEY = 'collect-readings-v1';
  const all = () => { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; } };
  
  const num = s => String(s).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));

  // عرض بيانات العميل بشكل مختصر ومفيد
  const clientName = p.get('n') || 'بدون اسم';
  const clientAddr = `قطاع ${p.get('s')} · بلوك ${p.get('b')} · عمارة ${p.get('d')} · شقة ${p.get('a')}`;
  document.getElementById('clientInfo').innerHTML = `<b>${clientName}</b><br>${clientAddr}`;

  // تقييد الإدخال إلى 5 أرقام
  document.getElementById('v').addEventListener('input', function() {
    if (this.value.length > 5) this.value = this.value.slice(0, 5);
  });

  document.getElementById('saveBtn').onclick = () => {
    const v = num(document.getElementById('v').value).trim();
    if (!v || isNaN(+v)) return alert('اكتب قراءة صحيحة');
    
    const a = all();
    a.push({
      k,
      name: p.get('n') || '',
      addr: `${p.get('s')}-${p.get('b')}-${p.get('d')}-${p.get('a')}`,
      v,
      note: document.getElementById('n').value,
      t: new Date().toISOString(),
      by: p.get('u') || ''
    });
    localStorage.setItem(KEY, JSON.stringify(a));
    alert('✅ تم حفظ القراءة بنجاح');
    document.getElementById('v').value = '';
    document.getElementById('n').value = '';
    
    // إغلاق النافذة والعودة للتطبيق الأساسي
    if (window.parent && window.parent !== window) {
      window.parent.document.querySelector('dialog[open]')?.close();
    }
  };

  document.getElementById('exportBtn').onclick = () => {
    const q = s => '"' + String(s).replace(/"/g, '""') + '"';
    const rows = [['العميل', 'العنوان', 'القراءة', 'ملاحظة', 'الوقت', 'المحصل'], ...all().map(r => [r.name, r.addr, r.v, r.note, r.t, r.by])];
    const b = new Blob(['\uFEFF' + rows.map(r => r.map(q).join(',')).join('\r\n')], { type: 'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = 'القراءات.csv';
    a.click();
  };
</script>
</body>
</html>
