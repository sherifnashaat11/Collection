<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بيان المستحقات</title>
<style>body{font-family:'Segoe UI',Tahoma,sans-serif;margin:0;padding:1rem;color:#0c2233;background:#fff}.r{max-width:380px;margin:auto;border:2px dashed #0c2233;border-radius:12px;padding:1rem}h1{font-size:1.1rem;text-align:center;margin:0 0 .6rem}.row{display:flex;justify-content:space-between;gap:1rem;padding:.35rem 0;border-bottom:1px solid #d3dde4}.row b{font-weight:600;color:#5b6f7d}.big{font-size:1.5rem;font-weight:800;text-align:center;margin:.9rem 0 .2rem}.foot{text-align:center;color:#5b6f7d;font-size:.8rem;margin-top:.6rem}button{display:block;margin:1rem auto;padding:.8rem 2.2rem;font:inherit;font-weight:700;background:#0a6fb0;color:#fff;border:0;border-radius:12px;cursor:pointer}@media print{button{display:none}body{padding:0}}</style></head><body>
<div class="r" id="r"></div><button onclick="print()">طباعة</button>
<script>
const p=new URLSearchParams(location.search),g=k=>p.get(k)||'—',box=document.getElementById('r');
const add=(l,v)=>{const d=document.createElement('div');d.className='row';const a=document.createElement('b'),b=document.createElement('span');a.textContent=l;b.textContent=v;d.append(a,b);box.append(d);};
const h=document.createElement('h1');h.textContent='بيان مستحقات غاز';box.append(h);
add('العميل',g('n'));add('العنوان',`قطاع ${g('s')} · بلوك ${g('b')} · عمارة ${g('d')} · شقة ${g('a')}`);add('شهر الإصدار',g('m'));add('عدد الفواتير',g('c'));add('إجمالي المديونية',g('v'));
if(+p.get('r'))add('رصيد مقدم',g('r'));
const big=document.createElement('div');big.className='big';big.textContent=`المطلوب: ${g('q')} جنيه`;box.append(big);
const f=document.createElement('div');f.className='foot';f.textContent=`المحصّل: ${g('u')} · ${new Date().toLocaleString('ar-EG')}`;box.append(f);
</script></body></html>
