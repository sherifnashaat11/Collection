<!DOCTYPE html>
<html lang="ar" dir="rtl" id="appHtml">
<head>
<link rel="manifest" href="manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="حاسبة الغاز">
<title id="appTitle">حاسبة فاتورة الغاز</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,'Segoe UI',Tahoma,Roboto,sans-serif;
  background:linear-gradient(180deg,#f1f5f9 0%,#e2e8f0 100%);
  color:#0f172a;padding-bottom:30px;min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
header{
  background:linear-gradient(135deg,#0f766e 0%,#14b8a6 60%,#2dd4bf 100%);
  color:#fff;padding:22px 16px 26px;text-align:center;
  box-shadow:0 6px 20px rgba(15,118,110,.25);
  position:sticky;top:0;z-index:10;border-radius:0 0 24px 24px;
}
header::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:4px;
  background:linear-gradient(90deg,#fbbf24,#f59e0b,#fbbf24);
  border-radius:0 0 24px 24px;
}
header h1{margin:0;font-size:20px;font-weight:800;text-shadow:0 2px 4px rgba(0,0,0,.15)}
header .sub{margin-top:8px;font-size:13px;opacity:.95;font-weight:600}
header .updated{
  margin-top:10px;display:inline-block;background:rgba(255,255,255,.22);
  padding:5px 14px;border-radius:20px;font-size:11.5px;font-weight:600;
  border:1px solid rgba(255,255,255,.3);
}
.card{
  background:#fff;margin:12px;border-radius:20px;padding:20px;
  box-shadow:0 4px 16px rgba(0,0,0,.06);border:1px solid #e2e8f0;
}
label{display:block;font-size:13px;font-weight:700;margin-bottom:7px;color:#334155}
input{
  width:100%;padding:14px;border:1.5px solid #cbd5e1;border-radius:12px;
  font-size:17px;background:#f8fafc;margin-bottom:16px;font-family:inherit;
  font-weight:600;color:#0f172a;transition:all .2s;
}
input:focus{outline:none;border-color:#14b8a6;background:#fff;box-shadow:0 0 0 4px rgba(20,184,166,.12)}
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{
  -webkit-appearance:none;
  margin:0;
}
input[type=number]{
  -moz-appearance:textfield;
  appearance:textfield;
}
button{
  width:100%;padding:16px;border:none;border-radius:14px;
  font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;transition:.15s;
}
button:active{transform:scale(.97)}
.hidden{display:none!important}

/* ============================================================
   Input Mode Selector
============================================================ */
.mode-heading{
  font-size:14px;
  font-weight:800;
  color:#0f766e;
  margin:0 auto 14px auto;
  padding:12px 14px;
  background:linear-gradient(135deg,#ccfbf1,#f0fdfa);
  border:1.5px solid #5eead4;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  line-height:1.5;
  text-align:center;
  max-width:340px;
}
.mode-heading::before{
  content:'👇';
  font-size:18px;
  flex-shrink:0;
}
.mode-selector{
  display:flex;
  flex-direction:row;
  align-items:stretch;
  justify-content:center;
  gap:12px;
  margin-bottom:18px;
  flex-wrap:nowrap;
}
.mode-btn{
  flex:1 1 0;
  max-width:240px;
  padding:14px 12px;
  border:2px solid #cbd5e1;
  border-radius:14px;
  font-size:13.5px;
  font-weight:800;
  font-family:inherit;
  cursor:pointer;
  background:#fff;
  color:#475569;
  transition:all .25s;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  gap:6px;
  line-height:1.4;
  min-height:60px;
}
.mode-btn:hover{
  border-color:#14b8a6;
  background:#f0fdfa;
}
.mode-btn.active{
  background:linear-gradient(135deg,#0f766e,#14b8a6);
  color:#fff;
  border-color:#0f766e;
  box-shadow:0 4px 14px rgba(15,118,110,0.35);
  transform:translateY(-1px);
}
.mode-btn:active{transform:scale(.97)}

.input-box-container{
  margin-top:14px;
  padding:16px;
  background:linear-gradient(135deg,#f8fafc,#f1f5f9);
  border-radius:14px;
  border:1.5px solid #e2e8f0;
  animation:slideDown .3s ease-out;
}
@keyframes slideDown{
  from{opacity:0;transform:translateY(-10px);}
  to{opacity:1;transform:translateY(0);}
}

.consumption-result{
  background:linear-gradient(135deg,#ccfbf1,#99f6e4);
  border:1.5px solid #5eead4;
  border-radius:12px;
  padding:14px;
  margin-top:8px;
  text-align:center;
  color:#0f766e;
  font-weight:800;
  font-size:15px;
}
.consumption-result .value{
  font-size:22px;
  font-weight:800;
  direction:ltr;
  display:inline-block;
  margin-inline-start:6px;
}

/* زر حساب الفاتورة */
#calcBtn{
  width:calc(100% - 24px);
  margin:14px 12px;
  padding:18px;
  font-size:17px;
  font-weight:800;
  background:linear-gradient(135deg,#0f766e 0%,#14b8a6 50%,#2dd4bf 100%);
  color:#fff;
  border:none;
  border-radius:16px;
  cursor:pointer;
  box-shadow:0 6px 20px rgba(15,118,110,.35);
  transition:.15s;
  font-family:inherit;
}
#calcBtn:active{transform:scale(.97)}

/* زر الأسعار المطبقة حالياً */
#currentPricesBtn{
  width:calc(100% - 24px);
  margin:0 12px 14px;
  padding:16px;
  font-size:15px;
  font-weight:800;
  background:linear-gradient(135deg,#0ea5e9,#0284c7);
  color:#fff;
  border:none;
  border-radius:16px;
  cursor:pointer;
  box-shadow:0 4px 16px rgba(14,165,233,.3);
  transition:.15s;
  font-family:inherit;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
}
#currentPricesBtn:active{transform:scale(.97)}

@media (max-width:600px){
  .mode-selector{gap:8px;}
  .mode-btn{font-size:12px;padding:10px 8px;min-height:56px;}
}

/* ============================================================
   Developer Badge - في أسفل الصفحة
============================================================ */
.developer-badge-container{
  display:flex;
  justify-content:center;
  margin:24px 12px 14px;
}
.developer-badge{
  background:linear-gradient(135deg,#f0fdf4 0%,#ccfbf1 100%);
  border:1.5px solid #5eead4;border-radius:18px;padding:16px;
  text-align:center;box-shadow:0 4px 14px rgba(15,118,110,.08);
  position:relative;overflow:hidden;
  max-width:520px;
  width:100%;
}
.developer-badge::before{content:'👨‍💻';position:absolute;top:-12px;left:-12px;font-size:60px;opacity:.06}
.developer-badge .dev-title{font-size:12px;color:#0f766e;font-weight:700;margin-bottom:5px;text-transform:uppercase}
.developer-badge .dev-name{font-size:15px;color:#134e4a;font-weight:800;margin-bottom:8px}
.developer-badge .dev-desc{font-size:12px;color:#334155;line-height:1.7}

/* ============================================================
   Modals
============================================================ */
.modal-overlay{
  position:fixed;inset:0;background:rgba(15,23,42,.7);
  display:flex;align-items:center;justify-content:center;
  z-index:100;padding:20px;backdrop-filter:blur(6px);
}
.modal{
  background:#fff;border-radius:26px;width:100%;max-width:480px;
  overflow:hidden;box-shadow:0 25px 60px -12px rgba(0,0,0,0.4);
  animation:pop .3s cubic-bezier(0.16,1,0.3,1);
  max-height:90vh;display:flex;flex-direction:column;
}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.modal-header{
  background:linear-gradient(135deg,#0f766e 0%,#14b8a6 60%,#2dd4bf 100%);
  color:#fff;padding:24px 22px;text-align:center;position:relative;
}
.modal-header::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,#fbbf24,#f59e0b,#fbbf24);
}
.modal-header .bill-title{
  font-size:13px;font-weight:700;background:rgba(255,255,255,0.22);
  padding:5px 14px;border-radius:12px;display:inline-block;margin-bottom:10px;
  border:1px solid rgba(255,255,255,.25);
}
.modal-header .label{font-size:12.5px;opacity:.92;margin-bottom:4px;font-weight:600}
.modal-header .total{
  font-size:46px;font-weight:800;letter-spacing:-1.5px;line-height:1;margin:8px 0;
  direction:ltr;unicode-bidi:embed;text-shadow:0 3px 8px rgba(0,0,0,.15);
}
.modal-header .total-words{
  font-size:12.5px;font-weight:700;background:rgba(255,255,255,0.22);
  padding:9px 15px;border-radius:12px;display:inline-block;margin-top:12px;
  max-width:100%;word-break:break-word;line-height:1.7;
  border:1px solid rgba(255,255,255,.25);white-space:pre-line;
}
.modal-body{padding:18px 20px;overflow-y:auto;flex:1;display:none;background:#f8fafc}
.modal-body.show{display:block}

/* ============================================================
   Summary Box - ملخص المدخلات
============================================================ */
.summary-box{
  background:linear-gradient(135deg,#ccfbf1,#f0fdfa);
  padding:14px;
  border-radius:14px;
  margin-bottom:16px;
  border:1.5px solid #5eead4;
}
.summary-box .sb-title{
  font-weight:800;
  color:#0f766e;
  font-size:13px;
  margin-bottom:10px;
  text-align:center;
}
.summary-box .sb-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:7px 10px;
  background:#fff;
  border-radius:8px;
  margin-bottom:6px;
  border:1px solid #e2e8f0;
  font-size:13px;
}
.summary-box .sb-row:last-child{margin-bottom:0}
.summary-box .sb-row .sb-label{color:#334155;font-weight:700}
.summary-box .sb-row .sb-value{color:#0f766e;font-weight:800;direction:ltr}

.modal-body .avg-box{
  background:linear-gradient(135deg,#f1f5f9,#e2e8f0);padding:14px;
  border-radius:14px;margin-bottom:16px;font-size:13px;color:#334155;
  line-height:1.8;border:1px solid #cbd5e1;text-align:center;
}
.modal-body .avg-box div{margin-bottom:2px}
.modal-body .avg-box div.title{font-weight:800;color:#0f766e;margin-bottom:5px;font-size:13px}
.modal-body .avg-box div.result{font-weight:800;color:#0f766e;margin-top:6px;font-size:16px}
.custom-table{
  width:100%;border-collapse:collapse;background:#fff;border:1px solid #cbd5e1;
  border-radius:10px;overflow:hidden;margin-bottom:10px;font-size:11px;
  box-shadow:0 2px 6px rgba(0,0,0,.04);
}
.custom-table th{
  background:linear-gradient(135deg,#0f766e,#14b8a6);color:#fff;
  padding:9px 6px;text-align:center;font-weight:700;font-size:11px;
}
.custom-table td{
  padding:9px 6px;border-bottom:1px solid #e2e8f0;text-align:center;
  color:#334155;font-weight:500;
}
.custom-table tr:last-child td{border-bottom:none}
.custom-table .total-row td{
  background:linear-gradient(135deg,#ccfbf1,#99f6e4);font-weight:800;
  color:#0f766e;font-size:12.5px;border-top:2px solid #0f766e;
}
.warning{
  background:linear-gradient(135deg,#fef3c7,#fde68a);color:#92400e;
  padding:12px;border-radius:12px;font-size:12px;margin-top:14px;
  line-height:1.7;border:1px solid #fcd34d;font-weight:600;
}
.modal-footer{
  padding:14px 20px 20px;display:flex;flex-direction:column;gap:8px;
  background:#fff;border-top:1px solid #e2e8f0;
}
.btn-toggle-details{
  background:linear-gradient(135deg,#e0f2fe,#bae6fd);color:#0369a1;
  font-size:14px;padding:13px;border:1px solid #7dd3fc;font-weight:800;
  border-radius:12px;
}
.btn-close{background:linear-gradient(135deg,#334155,#1e293b);color:#fff;font-size:14px;padding:13px;font-weight:700;border-radius:12px}

/* أزرار نافذة الأسعار */
.prices-modal{
  background:#fff;border-radius:26px;width:100%;max-width:520px;
  overflow:hidden;box-shadow:0 25px 60px -12px rgba(0,0,0,0.4);
  animation:pop .3s cubic-bezier(0.16,1,0.3,1);
  max-height:90vh;display:flex;flex-direction:column;
}
.prices-modal-header{
  background:linear-gradient(135deg,#0ea5e9,#0284c7);
  color:#fff;padding:20px 22px;text-align:center;position:relative;
}
.prices-modal-header::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,#fbbf24,#f59e0b,#fbbf24);
}
.prices-modal-header .pm-title{font-size:16px;font-weight:800;margin:0}
.prices-modal-header .pm-sub{font-size:12px;opacity:.92;margin-top:5px;font-weight:600}
.prices-modal-body{
  padding:16px 18px;overflow-y:auto;flex:1;background:#f8fafc;
}
.prices-modal-footer{
  padding:14px 20px 18px;background:#fff;
  border-top:1px solid #e2e8f0;
}
</style>
</head>
<body>

<header>
  <h1 id="hdrTitle">🔥 حاسبة فاتورة الغاز</h1>
  <div class="sub" id="currentMonth"></div>
  <div class="updated" id="updatedLabel">آخر تحديث للأسعار في —</div>
</header>

<div class="card">
  <label id="labelMonths">عدد أشهر المحاسبة</label>
  <input type="number" id="months" value="1" min="1" inputmode="numeric">

  <div class="mode-heading" id="labelInputMode">اختر طريقة إدخال الاستهلاك</div>

  <div class="mode-selector" id="modeSelector">
    <button type="button" class="mode-btn" id="modeDirectBtn" onclick="setInputMode('direct')">
      <span id="modeDirectLabel">🎯 الاستهلاك</span>
    </button>
    <button type="button" class="mode-btn" id="modeReadingsBtn" onclick="setInputMode('readings')">
      <span id="modeReadingsLabel">📊 إدخال القراءات السابقة والحالية</span>
    </button>
  </div>

  <div id="directModeBox" class="input-box-container hidden">
    <label id="labelConsumption">الاستهلاك (متر مكعب)</label>
    <input type="number" id="consumption" value="0" min="0" inputmode="decimal" step="any">
  </div>

  <div id="readingsModeBox" class="input-box-container hidden">
    <label id="labelPrevReading">القراءة السابقة</label>
    <input type="number" id="prevReading" value="0" min="0" inputmode="decimal" step="any">
    <label id="labelCurrReading">القراءة الحالية</label>
    <input type="number" id="currReading" value="0" min="0" inputmode="decimal" step="any">
    <div class="consumption-result" id="consumptionResult">
      <span id="consumptionResultLabel">الاستهلاك</span>:
      <span class="value" id="consumptionValue">0</span>
      <span style="font-size:14px;">m³</span>
    </div>
    <div id="readingError" class="msg" style="color:#b91c1c;min-height:0;"></div>
  </div>
</div>

<!-- زر حساب الفاتورة -->
<button id="calcBtn" onclick="performCalculation()">
  <span id="calcBtnLabel">🧮 حساب الفاتورة</span>
</button>

<!-- زر الأسعار المطبقة حالياً -->
<button id="currentPricesBtn" onclick="showCurrentPrices()">
  <span id="currentPricesBtnLabel">💰 الأسعار المطبقة حالياً</span>
</button>

<!-- بطاقة إعداد وتطوير - في أسفل الصفحة -->
<div class="developer-badge-container">
  <div class="developer-badge" id="developerBadge">
    <div class="dev-title" id="devTitle">إعداد وتطوير</div>
    <div class="dev-name" id="devName">شريف محمد نشأت محمد</div>
    <div class="dev-desc" id="devDesc">تطبيق ذكي ومتقن دقيق الحسابات، مصمم خصيصاً ليقدم تجربة سهلة وسريعة تخدم كلًا من المحصل والعميل بكل شفافية وموثوقية.</div>
  </div>
</div>

<script>
/* ============================================================
   المتغيرات العامة
============================================================ */
const STORAGE_KEY = 'gasBillPeriods_v22';
const FEES_KEY = 'gasBillFees_v22';

const DEFAULT_PERIODS = [
  { date:'2016-11-01', tiers:[{name:'الأولى',limit:30,price:0.75},{name:'الثانية',limit:60,price:1.50},{name:'الثالثة',limit:null,price:2.00}] },
  { date:'2017-07-01', tiers:[{name:'الأولى',limit:30,price:1.00},{name:'الثانية',limit:60,price:1.75},{name:'الثالثة',limit:null,price:2.50}] },
  { date:'2018-08-01', tiers:[{name:'الأولى',limit:30,price:1.75},{name:'الثانية',limit:60,price:2.50},{name:'الثالثة',limit:null,price:3.15}] },
  { date:'2019-07-01', tiers:[{name:'الأولى',limit:30,price:2.35},{name:'الثانية',limit:60,price:3.10},{name:'الثالثة',limit:null,price:3.60}] },
  { date:'2021-10-01', tiers:[{name:'الأولى',limit:30,price:2.50},{name:'الثانية',limit:60,price:3.25},{name:'الثالثة',limit:null,price:3.75}] },
  { date:'2024-09-01', tiers:[{name:'الأولى',limit:30,price:3.00},{name:'الثانية',limit:60,price:4.00},{name:'الثالثة',limit:null,price:5.00}] },
  { date:'2025-06-01', tiers:[{name:'الأولى',limit:30,price:4.00},{name:'الثانية',limit:60,price:5.00},{name:'الثالثة',limit:null,price:6.00}] },
  { date:'2025-10-01', tiers:[{name:'الأولى',limit:30,price:5.00},{name:'الثانية',limit:60,price:6.00},{name:'الثالثة',limit:null,price:9.00}] },
  { date:'2026-03-01', tiers:[{name:'الأولى',limit:30,price:6.00},{name:'الثانية',limit:60,price:8.00},{name:'الثالثة',limit:null,price:12.00}] }
];

let periods = [];
let fees = 18;
let inputMode = null;

/* ============================================================
   التخزين
============================================================ */
function loadPeriods(){
  try{
    const s = localStorage.getItem(STORAGE_KEY);
    if(s){
      const parsed = JSON.parse(s);
      if(Array.isArray(parsed) && parsed.length > 0) return parsed;
    }
  }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT_PERIODS));
}
function loadFees(){
  try{
    const v = localStorage.getItem(FEES_KEY);
    return v !== null ? Number(v) : 18;
  }catch(e){ return 18; }
}
function saveAll(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(periods));
    localStorage.setItem(FEES_KEY, String(fees));
  }catch(e){}
}

/* ============================================================
   طريقة الإدخال
============================================================ */
function setInputMode(mode){
  inputMode = mode;
  const directBtn = document.getElementById('modeDirectBtn');
  const readingsBtn = document.getElementById('modeReadingsBtn');
  const directBox = document.getElementById('directModeBox');
  const readingsBox = document.getElementById('readingsModeBox');

  if (mode === 'readings'){
    readingsBtn.classList.add('active');
    directBtn.classList.remove('active');
    directBox.classList.add('hidden');
    readingsBox.classList.remove('hidden');
  } else {
    directBtn.classList.add('active');
    readingsBtn.classList.remove('active');
    readingsBox.classList.add('hidden');
    directBox.classList.remove('hidden');
  }
}

function updateConsumptionFromReadings(){
  const prev = Number(document.getElementById('prevReading').value) || 0;
  const curr = Number(document.getElementById('currReading').value) || 0;
  const diff = curr - prev;
  const valEl = document.getElementById('consumptionValue');
  const errEl = document.getElementById('readingError');

  if (diff < 0){
    valEl.textContent = '0';
    valEl.style.color = '#b91c1c';
    errEl.textContent = '⚠️ لا يجوز أن تكون القراءة الحالية أقل من القراءة السابقة';
  } else {
    valEl.textContent = smartFmt(diff);
    valEl.style.color = '#0f766e';
    errEl.textContent = '';
  }
}

/* ============================================================
   خريطة أسماء الشرائح
============================================================ */
const TIER_NAME_MAP_REVERSE = {}; // لم نعد بحاجة للخريطة الإنجليزية
const ArabicPeriodNames = ['', 'الأولى', 'الثانية', 'الثالثة', 'الرابعة', 'الخامسة', 'السادسة', 'السابعة', 'الثامنة', 'التاسعة', 'العاشرة'];

function getTierDisplayName(name){
  if (TIER_NAME_MAP_REVERSE[name]) return TIER_NAME_MAP_REVERSE[name];
  const n = parseInt(name);
  if (!isNaN(n) && n >= 1 && n <= 10) return ArabicPeriodNames[n];
  return name;
}

/* ============================================================
   أدوات التنسيق
============================================================ */
function smartFmt(val){
  const num = Number(val) || 0;
  if (Number.isInteger(num)) return num.toLocaleString('en-US');
  return num.toLocaleString('en-US', {minimumFractionDigits:1, maximumFractionDigits:2});
}
function parseDate(s){
  const parts = String(s).split('-');
  return { y: Number(parts[0])||2026, m: Number(parts[1])||1, d: Number(parts[2])||1 };
}
function mIdx(y,m){ return y*12+(m-1); }
function fmtDateAr(s){
  try{
    const {y,m,d} = parseDate(s);
    return new Date(y, m-1, d).toLocaleDateString('ar-EG',{day:'numeric',month:'long',year:'numeric'});
  }catch(e){ return s; }
}
function fmtMonthYear(y, m){
  const dt = new Date(y, m-1, 1);
  return dt.toLocaleDateString('ar-EG',{month:'long', year:'numeric'});
}

/* ============================================================
   تحويل الأرقام إلى كلمات عربية
============================================================ */
function numberToArabicWords(n){
  const num = Math.floor(Number(n) || 0);
  if (num === 0) return 'فقط صِفْرٌ\nجنيها مصريا فقط لاغير';

  const units = ['','مائة','مئتان','ثلاثمائة','أربعمائة','خمسمائة','ستمائة','سبعمائة','ثمانمائة','تسعمائة'];
  const tens  = ['','عشرة','عشرون','ثلاثون','أربعون','خمسون','ستون','سبعون','ثمانون','تسعون'];
  const teens = ['عشرة','أحد عشر','اثنا عشر','ثلاثة عشر','أربعة عشر','خمسة عشر','ستة عشر','سبعة عشر','ثمانية عشر','تسعة عشر'];
  const ones  = ['','واحد','اثنان','ثلاثة','أربعة','خمسة','ستة','سبعة','ثمانية','تسعة'];

  function less1000(val){
    if (val === 0) return '';
    let res = '';
    const h = Math.floor(val/100);
    const rem = val % 100;
    if (h > 0) res += units[h];
    if (rem > 0){
      if (res) res += ' و';
      if (rem < 10) res += ones[rem];
      else if (rem < 20) res += teens[rem-10];
      else{
        const t = Math.floor(rem/10);
        const o = rem % 10;
        if (o > 0) res += ones[o] + ' و';
        res += tens[t];
      }
    }
    return res;
  }
  function convert(val){
    if (val === 0) return '';
    if (val < 1000) return less1000(val);
    if (val < 1000000){
      const th = Math.floor(val/1000);
      const rem = val % 1000;
      let thStr = '';
      if (th === 1) thStr = 'ألف';
      else if (th === 2) thStr = 'ألفان';
      else if (th <= 10) thStr = less1000(th) + ' آلاف';
      else thStr = less1000(th) + ' ألفاً';
      if (rem > 0) thStr += ' و' + less1000(rem);
      return thStr;
    }
    return String(val);
  }
  return `فقط ${convert(num)}\nجنيها مصريا فقط لاغير`;
}

function getAmountInWords(amount){
  return numberToArabicWords(amount);
}

/* ============================================================
   حساب تكلفة شهر واحد
============================================================ */
function monthlyCostDetailed(cons, tiers){
  let rem = Number(cons) || 0;
  let cost = 0;
  let prev = 0;
  const tableRows = [];

  if (!Array.isArray(tiers)) return { cost:0, rows:[] };

  for (let i=0; i<tiers.length; i++){
    if (rem <= 0) break;
    const t = tiers[i];
    let cap;
    if (t.limit === null || t.limit === undefined || t.limit === '' || isNaN(t.limit)){
      cap = rem;
    } else {
      cap = Math.max(0, Number(t.limit) - prev);
    }
    const used = Math.min(rem, cap);
    const tierCost = used * (Number(t.price) || 0);
    cost += tierCost;
    if (used > 0){
      const displayName = getTierDisplayName(t.name);
      tableRows.push({
        tierName: `شريحة ${displayName}`,
        price: t.price,
        meters: used,
        total: tierCost
      });
    }
    rem -= used;
    if (t.limit !== null && t.limit !== undefined && t.limit !== '' && !isNaN(t.limit)){
      prev = Number(t.limit);
    }
  }
  return { cost, rows: tableRows };
}

/* ============================================================
   الحساب الرئيسي
============================================================ */
function calculateInternal(){
  if (inputMode === 'readings'){
    const prev = Number(document.getElementById('prevReading').value) || 0;
    const curr = Number(document.getElementById('currReading').value) || 0;
    if (curr < prev) return { error: 'reading_negative' };
  }

  if (!inputMode) return { error: 'no_mode' };

  const months = Number(document.getElementById('months').value) || 1;
  if (months < 1) return { error: 'months_invalid' };

  let cons = 0;
  let prevReading = 0;
  let currReading = 0;

  if (inputMode === 'readings'){
    prevReading = Number(document.getElementById('prevReading').value) || 0;
    currReading = Number(document.getElementById('currReading').value) || 0;
    cons = currReading - prevReading;
  } else {
    cons = Number(document.getElementById('consumption').value) || 0;
  }

  const avg = cons / months;
  const now = new Date();
  const targetDate = new Date(now.getFullYear(), now.getMonth() + 1, 1);
  const aEnd   = mIdx(targetDate.getFullYear(), targetDate.getMonth() + 1);
  const aStart = aEnd - months + 1;

  const endMonthName = targetDate.toLocaleDateString('ar-EG', {month:'long', year:'numeric'});
  const billPeriodText = `فاتورة شهر ${endMonthName}`;

  const sorted = [...periods].sort((a,b)=> a.date.localeCompare(b.date));

  let totalConsumptionCost = 0;
  const rows = [];
  let totalCovered = 0;

  for (let i=0; i<sorted.length; i++){
    const pDate = parseDate(sorted[i].date);
    const start = (i === 0) ? -Infinity : mIdx(pDate.y, pDate.m);
    const nextPDate = (i < sorted.length - 1) ? parseDate(sorted[i+1].date) : null;
    const end = nextPDate === null ? Infinity : mIdx(nextPDate.y, nextPDate.m) - 1;

    const s = Math.max(start, aStart);
    const e = Math.min(end, aEnd);
    const overlap = Math.max(0, e - s + 1);
    if (overlap === 0) continue;

    const res = monthlyCostDetailed(avg, sorted[i].tiers);
    const sub = overlap * res.cost;
    totalConsumptionCost += sub;
    totalCovered += overlap;

    const startYear = Math.floor(s/12);
    const startMonth = (s % 12) + 1;
    const fromText = fmtMonthYear(startYear, startMonth);

    const endYear = Math.floor(e/12);
    const endMonth = (e % 12) + 1;
    const toText = fmtMonthYear(endYear, endMonth);

    rows.push({
      fromText, toText,
      months: overlap,
      monthlyCost: res.cost,
      subtotal: sub,
      tierRows: res.rows,
      avg: avg
    });
  }

  const exactGrandTotal = totalConsumptionCost + fees;
  const grandTotal = Math.round(exactGrandTotal);
  const grandTotalWords = getAmountInWords(grandTotal);

  return {
    months, cons, fees, avg, rows,
    inputMode,
    prevReading, currReading,
    totalConsumptionCost, grandTotal, exactGrandTotal,
    totalCovered, billPeriodText, grandTotalWords
  };
}

/* ============================================================
   حساب الفاتورة عند الضغط على الزر
============================================================ */
function performCalculation(){
  if (!inputMode){
    alert('⚠️ يرجى اختيار طريقة إدخال الاستهلاك أولاً');
    return;
  }

  if (inputMode === 'readings'){
    const prev = Number(document.getElementById('prevReading').value) || 0;
    const curr = Number(document.getElementById('currReading').value) || 0;
    if (curr < prev){
      alert('⚠️ لا يجوز أن تكون القراءة الحالية أقل من القراءة السابقة');
      return;
    }
  }

  const r = calculateInternal();
  if (r.error){
    alert('⚠️ بيانات غير صحيحة');
    return;
  }

  showResult(r);
}
