<!DOCTYPE html>
<html lang="ar" dir="rtl" id="appHtml">
<head>
<link rel="manifest" href="manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#7c3aed">
<title id="appTitle">حاسبة فاتورة الغاز</title>
<style>
/* ============================================================
   تنسيقات أساسية ومتغيرات الألوان (تتطابق مع التطبيق الأساسي)
============================================================ */
:root{
  --primary: #7c3aed;
  --primary-soft: #ede9fe;
  --ember: #d97706;
  --ember-soft: #fef3c7;
  --bg: #f4f7fa;
  --card: #ffffff;
  --ink: #0f2438;
  --mute: #6b7f8f;
  --line: #d6e0e8;
  --danger: #d63a3a;
  --success: #0d9668;
}
@media(prefers-color-scheme:dark), body[data-theme="dark"]{
  :root{
    --bg: #0a1722;
    --card: #1a2f42;
    --ink: #e7eff5;
    --mute: #8da4b4;
    --line: #2a4257;
    --primary: #a78bfa;
    --primary-soft: #2e1065;
    --ember: #f5b53a;
    --ember-soft: #451a03;
  }
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,'Segoe UI',Tahoma,Roboto,sans-serif;
  background:var(--bg);
  color:var(--ink);padding-bottom:30px;min-height:100vh;
  -webkit-font-smoothing:antialiased;
  transition: background 0.3s, color 0.3s;
}

/* ============================================================
   الهيدر
============================================================ */
header{
  background:linear-gradient(135deg,#0f172a 0%,#1e293b 100%);
  color:#fff;padding:22px 16px 26px;text-align:center;
  box-shadow:0 6px 20px rgba(0,0,0,.15);
  position:sticky;top:0;z-index:10;border-radius:0 0 24px 24px;
}
header::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:4px;
  background:linear-gradient(90deg,var(--ember),#fbbf24,var(--ember));
  border-radius:0 0 24px 24px;
}
header h1{margin:0;font-size:20px;font-weight:800;text-shadow:0 2px 4px rgba(0,0,0,.15)}
header .sub{margin-top:8px;font-size:13px;opacity:.95;font-weight:600}
header .updated{
  margin-top:10px;display:inline-block;background:rgba(255,255,255,.22);
  padding:5px 14px;border-radius:20px;font-size:11.5px;font-weight:600;
  border:1px solid rgba(255,255,255,.3);
}

/* ============================================================
   الحاويات والبطاقات
============================================================ */
.card{
  background:var(--card);margin:12px;border-radius:20px;padding:20px;
  box-shadow:0 4px 16px rgba(0,0,0,.06);border:1px solid var(--line);
}
label{display:block;font-size:13px;font-weight:700;margin-bottom:7px;color:var(--ink)}
input{
  width:100%;padding:14px;border:1.5px solid var(--line);border-radius:12px;
  font-size:17px;background:var(--bg);margin-bottom:16px;font-family:inherit;
  font-weight:600;color:var(--ink);transition:all .2s;
}
input:focus{outline:none;border-color:var(--primary);background:var(--card);box-shadow:0 0 0 4px var(--primary-soft)}
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
input[type=number]{-moz-appearance:textfield;appearance:textfield;}

button{
  width:100%;padding:16px;border:none;border-radius:14px;
  font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;transition:.15s;
}
button:active{transform:scale(.97)}
.hidden{display:none!important}

/* ============================================================
   اختيار طريقة الإدخال
============================================================ */
.mode-heading{
  font-size:14px;font-weight:800;color:var(--primary);
  margin:0 auto 14px auto;padding:12px 14px;
  background:var(--primary-soft);border:1.5px solid var(--primary);
  border-radius:12px;display:flex;align-items:center;justify-content:center;
  gap:8px;line-height:1.5;text-align:center;max-width:340px;
}
.mode-heading::before{content:'👇';font-size:18px;flex-shrink:0;}
.mode-selector{display:flex;flex-direction:row;align-items:stretch;justify-content:center;gap:12px;margin-bottom:18px;flex-wrap:nowrap;}
.mode-btn{
  flex:1 1 0;max-width:240px;padding:14px 12px;border:2px solid var(--line);
  border-radius:14px;font-size:13.5px;font-weight:800;font-family:inherit;
  cursor:pointer;background:var(--card);color:var(--mute);transition:all .25s;
  display:flex;align-items:center;justify-content:center;text-align:center;
  gap:6px;line-height:1.4;min-height:60px;
}
.mode-btn:hover{border-color:var(--primary);background:var(--primary-soft);}
.mode-btn.active{
  background:var(--primary);color:#fff;border-color:var(--primary);
  box-shadow:0 4px 14px rgba(124, 58, 237, 0.35);transform:translateY(-1px);
}
.input-box-container{
  margin-top:14px;padding:16px;background:var(--bg);
  border-radius:14px;border:1.5px solid var(--line);animation:slideDown .3s ease-out;
}
@keyframes slideDown{from{opacity:0;transform:translateY(-10px);}to{opacity:1;transform:translateY(0);}}

.consumption-result{
  background:var(--primary-soft);border:1.5px solid var(--primary);
  border-radius:12px;padding:14px;margin-top:8px;text-align:center;
  color:var(--primary);font-weight:800;font-size:15px;
}
.consumption-result .value{font-size:22px;font-weight:800;direction:ltr;display:inline-block;margin-inline-start:6px;}

/* ============================================================
   الأزرار الرئيسية
============================================================ */
#calcBtn{
  width:calc(100% - 24px);margin:14px 12px;padding:18px;font-size:17px;font-weight:800;
  background:var(--primary);color:#fff;border:none;border-radius:16px;cursor:pointer;
  box-shadow:0 6px 20px rgba(124, 58, 237, 0.35);transition:.15s;
}
#calcBtn:active{transform:scale(.97)}

#archiveBtn{
  width:calc(100% - 24px);margin:0 12px 14px;padding:18px;font-size:17px;font-weight:800;
  background:var(--success);color:#fff;border:none;border-radius:16px;cursor:pointer;
  box-shadow:0 6px 20px rgba(13, 150, 104, 0.35);transition:.15s;
}
#archiveBtn:active{transform:scale(.97)}

#currentPricesBtn{
  width:calc(100% - 24px);margin:0 12px 14px;padding:16px;font-size:15px;font-weight:800;
  background:var(--ember);color:#fff;border:none;border-radius:16px;cursor:pointer;
  box-shadow:0 4px 16px rgba(217, 119, 6, 0.3);transition:.15s;
  display:flex;align-items:center;justify-content:center;gap:8px;
}

/* ============================================================
   النوافذ المنبثقة (Modals)
============================================================ */
.modal-overlay{
  position:fixed;inset:0;background:rgba(15,23,42,.7);
  display:flex;align-items:center;justify-content:center;
  z-index:100;padding:20px;backdrop-filter:blur(6px);
}
.modal{
  background:var(--card);border-radius:26px;width:100%;max-width:480px;
  overflow:hidden;box-shadow:0 25px 60px -12px rgba(0,0,0,0.4);
  animation:pop .3s cubic-bezier(0.16,1,0.3,1);max-height:90vh;display:flex;flex-direction:column;
}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.modal-header{
  background:linear-gradient(135deg,#0f172a 0%,#1e293b 100%);
  color:#fff;padding:24px 22px;text-align:center;position:relative;
}
.modal-header::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--ember),#fbbf24,var(--ember));
}
.modal-header .bill-title{font-size:13px;font-weight:700;background:rgba(255,255,255,0.22);padding:5px 14px;border-radius:12px;display:inline-block;margin-bottom:10px;border:1px solid rgba(255,255,255,.25);}
.modal-header .label{font-size:12.5px;opacity:.92;margin-bottom:4px;font-weight:600}
.modal-header .total{font-size:46px;font-weight:800;letter-spacing:-1.5px;line-height:1;margin:8px 0;direction:ltr;unicode-bidi:embed;text-shadow:0 3px 8px rgba(0,0,0,.15);}
.modal-header .total-words{font-size:12.5px;font-weight:700;background:rgba(255,255,255,0.22);padding:9px 15px;border-radius:12px;display:inline-block;margin-top:12px;max-width:100%;word-break:break-word;line-height:1.7;border:1px solid rgba(255,255,255,.25);white-space:pre-line;}
.modal-body{padding:18px 20px;overflow-y:auto;flex:1;display:none;background:var(--bg)}
.modal-body.show{display:block}

/* ============================================================
   تفاصيل الفاتورة
============================================================ */
.summary-box{background:var(--primary-soft);padding:14px;border-radius:14px;margin-bottom:16px;border:1.5px solid var(--primary);}
.summary-box .sb-title{font-weight:800;color:var(--primary);font-size:13px;margin-bottom:10px;text-align:center;}
.summary-box .sb-row{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;background:var(--card);border-radius:8px;margin-bottom:6px;border:1px solid var(--line);font-size:13px;}
.summary-box .sb-row .sb-label{color:var(--ink);font-weight:700}
.summary-box .sb-row .sb-value{color:var(--primary);font-weight:800;direction:ltr}

.custom-table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:10px;font-size:11px;box-shadow:0 2px 6px rgba(0,0,0,.04);}
.custom-table th{background:var(--primary);color:#fff;padding:9px 6px;text-align:center;font-weight:700;font-size:11px;}
.custom-table td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:center;color:var(--ink);font-weight:500;}
.custom-table .total-row td{background:var(--primary-soft);font-weight:800;color:var(--primary);font-size:12.5px;border-top:2px solid var(--primary);}
.warning{background:var(--ember-soft);color:var(--ember);padding:12px;border-radius:12px;font-size:12px;margin-top:14px;line-height:1.7;border:1px solid var(--ember);font-weight:600;}

.modal-footer{padding:14px 20px 20px;display:flex;flex-direction:column;gap:8px;background:var(--card);border-top:1px solid var(--line);}
.btn-toggle-details{background:var(--primary-soft);color:var(--primary);font-size:14px;padding:13px;border:1px solid var(--primary);font-weight:800;border-radius:12px;}
.btn-close{background:var(--ink);color:var(--bg);font-size:14px;padding:13px;font-weight:700;border-radius:12px;}

/* ============================================================
   Developer Badge
============================================================ */
.developer-badge-container{display:flex;justify-content:center;margin:24px 12px 14px;}
.developer-badge{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:16px;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.05);max-width:520px;width:100%;}
.developer-badge .dev-title{font-size:12px;color:var(--mute);font-weight:700;margin-bottom:5px;}
.developer-badge .dev-name{font-size:15px;color:var(--primary);font-weight:800;margin-bottom:8px;}
.developer-badge .dev-desc{font-size:12px;color:var(--ink);line-height:1.7;}

@media (max-width:600px){.mode-selector{gap:8px;}.mode-btn{font-size:12px;padding:10px 8px;min-height:56px;}}
</style>
</head>
<body>

<header>
  <h1 id="hdrTitle">🔥 حاسبة فاتورة الغاز</h1>
  <div class="sub" id="currentMonth"></div>
  <div class="updated" id="updatedLabel">آخر تحديث للأسعار في —</div>
</header>

<!-- شريط معلومات العميل (يظهر فقط عند الربط مع التطبيق) -->
<div class="card hidden" id="clientInfoCard" style="background:var(--ember-soft); border-color:var(--ember); text-align:center; font-weight:800; color:var(--ember); padding:12px; margin-bottom:0;">
  <div id="clientName">اسم العميل</div>
  <div id="clientAddress" style="font-size:12px; margin-top:4px; opacity:0.8;">العنوان</div>
</div>

<div class="card">
  <label id="labelMonths">عدد أشهر المحاسبة</label>
  <input type="number" id="months" value="1" min="1" inputmode="numeric">

  <div class="mode-heading" id="labelInputMode">اختر طريقة إدخال الاستهلاك</div>

  <div class="mode-selector" id="modeSelector">
    <button type="button" class="mode-btn" id="modeDirectBtn" onclick="setInputMode('direct')">
      <span>🎯 الاستهلاك المباشر</span>
    </button>
    <button type="button" class="mode-btn" id="modeReadingsBtn" onclick="setInputMode('readings')">
      <span>📊 إدخال القراءات</span>
    </button>
  </div>

  <div id="directModeBox" class="input-box-container hidden">
    <label id="labelConsumption">الاستهلاك (متر مكعب)</label>
    <input type="number" id="consumption" value="0" min="0" inputmode="decimal" step="any">
  </div>

  <div id="readingsModeBox" class="input-box-container hidden">
    <label id="labelPrevReading">القراءة السابقة</label>
    <input type="number" id="prevReading" value="0" min="0" inputmode="decimal" step="any">
    <label id="labelCurrReading">القراءة الحالية</label>
    <input type="number" id="currReading" value="0" min="0" inputmode="decimal" step="any">
    <div class="consumption-result" id="consumptionResult">
      <span id="consumptionResultLabel">الاستهلاك</span>:
      <span class="value" id="consumptionValue">0</span>
      <span style="font-size:14px;">m³</span>
    </div>
    <div id="readingError" class="msg" style="color:var(--danger);min-height:0;font-size:12px;font-weight:700;margin-top:5px;"></div>
  </div>
</div>

<!-- أزرار العمليات -->
<button id="calcBtn" onclick="performCalculation()">
  <span id="calcBtnLabel">🧮 حساب الفاتورة</span>
</button>

<!-- يظهر فقط عند الربط مع التطبيق -->
<button id="archiveBtn" class="hidden" onclick="saveToArchive()">
  💾 حفظ الفاتورة والقراءة في الأرشيف
</button>

<button id="currentPricesBtn" onclick="showCurrentPrices()">
  <span>💰 الأسعار المطبقة حالياً</span>
</button>

<!-- بطاقة المطور -->
<div class="developer-badge-container">
  <div class="developer-badge" id="developerBadge">
    <div class="dev-title" id="devTitle">إعداد وتطوير</div>
    <div class="dev-name" id="devName">شريف محمد نشأت محمد</div>
    <div class="dev-desc" id="devDesc">تطبيق ذكي ومتقن دقيق الحسابات، مصمم خصيصاً ليقدم تجربة سهلة وسريعة تخدم كلًا من المحصل والعميل بكل شفافية وموثوقية.</div>
  </div>
</div>

<script>
/* ============================================================
   المتغيرات العامة
============================================================ */
const STORAGE_KEY = 'gasBillPeriods_v22';
const FEES_KEY = 'gasBillFees_v22';

// بيانات العميل (تأتي من التطبيق الأساسي)
let clientData = null; 

const DEFAULT_PERIODS = [
  { date:'2016-11-01', tiers:[{name:'الأولى',limit:30,price:0.75},{name:'الثانية',limit:60,price:1.50},{name:'الثالثة',limit:null,price:2.00}] },
  { date:'2017-07-01', tiers:[{name:'الأولى',limit:30,price:1.00},{name:'الثانية',limit:60,price:1.75},{name:'الثالثة',limit:null,price:2.50}] },
  { date:'2018-08-01', tiers:[{name:'الأولى',limit:30,price:1.75},{name:'الثانية',limit:60,price:2.50},{name:'الثالثة',limit:null,price:3.15}] },
  { date:'2019-07-01', tiers:[{name:'الأولى',limit:30,price:2.35},{name:'الثانية',limit:60,price:3.10},{name:'الثالثة',limit:null,price:3.60}] },
  { date:'2021-10-01', tiers:[{name:'الأولى',limit:30,price:2.50},{name:'الثانية',limit:60,price:3.25},{name:'الثالثة',limit:null,price:3.75}] },
  { date:'2024-09-01', tiers:[{name:'الأولى',limit:30,price:3.00},{name:'الثانية',limit:60,price:4.00},{name:'الثالثة',limit:null,price:5.00}] },
  { date:'2025-06-01', tiers:[{name:'الأولى',limit:30,price:4.00},{name:'الثانية',limit:60,price:5.00},{name:'الثالثة',limit:null,price:6.00}] },
  { date:'2025-10-01', tiers:[{name:'الأولى',limit:30,price:5.00},{name:'الثانية',limit:60,price:6.00},{name:'الثالثة',limit:null,price:9.00}] },
  { date:'2026-03-01', tiers:[{name:'الأولى',limit:30,price:6.00},{name:'الثانية',limit:60,price:8.00},{name:'الثالثة',limit:null,price:12.00}] }
];

let periods = [];
let fees = 18;
let inputMode = null;
let currentResult = null; // لحفظ نتيجة الحساب الحالية عند الأرشفة

/* ============================================================
   التخزين والتحميل
============================================================ */
function loadPeriods(){
  try{
    const s = localStorage.getItem(STORAGE_KEY);
    if(s){
      const parsed = JSON.parse(s);
      if(Array.isArray(parsed) && parsed.length > 0) return parsed;
    }
  }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT_PERIODS));
}
function loadFees(){
  try{
    const v = localStorage.getItem(FEES_KEY);
    return v !== null ? Number(v) : 18;
  }catch(e){ return 18; }
}
function saveAll(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(periods));
    localStorage.setItem(FEES_KEY, String(fees));
  }catch(e){}
}

/* ============================================================
   استقبال بيانات العميل من التطبيق (URL)
============================================================ */
function initClientData(){
  const p = new URLSearchParams(location.search);
  const name = p.get('n');
  const key = p.get('k'); // مفتاح العميل (قطاع|بلوك|عمارة|شقة)
  const prev = p.get('prev'); // القراءة السابقة

  if (key && name) {
    clientData = {
      name: name,
      key: key,
      sector: p.get('s') || '',
      blk: p.get('b') || '',
      bld: p.get('d') || '',
      apt: p.get('a') || '',
      prevReading: prev ? Number(prev) : 0
    };

    // عرض بيانات العميل
    const infoCard = document.getElementById('clientInfoCard');
    infoCard.classList.remove('hidden');
    document.getElementById('clientName').textContent = `👤 ${clientData.name}`;
    document.getElementById('clientAddress').textContent = `قطاع ${clientData.sector} · بلوك ${clientData.blk} · عمارة ${clientData.bld} · شقة ${clientData.apt}`;

    // تفعيل وضع القراءات تلقائياً وتعبئة القراءة السابقة
    setInputMode('readings');
    document.getElementById('prevReading').value = clientData.prevReading;
    document.getElementById('prevReading').setAttribute('readonly', 'true'); // لمنع التعديل
    document.getElementById('prevReading').style.background = '#e2e8f0';
    
    // إظهار زر الأرشفة
    document.getElementById('archiveBtn').classList.remove('hidden');
  } else {
    // فتح الحاسبة بشكل مستقل (بدون عميل)
    setInputMode('readings'); // الوضع الافتراضي
  }
}

/* ============================================================
   طريقة الإدخال
============================================================ */
function setInputMode(mode){
  inputMode = mode;
  const directBtn = document.getElementById('modeDirectBtn');
  const readingsBtn = document.getElementById('modeReadingsBtn');
  const directBox = document.getElementById('directModeBox');
  const readingsBox = document.getElementById('readingsModeBox');

  if (mode === 'readings'){
    readingsBtn.classList.add('active');
    directBtn.classList.remove('active');
    directBox.classList.add('hidden');
    readingsBox.classList.remove('hidden');
  } else {
    directBtn.classList.add('active');
    readingsBtn.classList.remove('active');
    readingsBox.classList.add('hidden');
    directBox.classList.remove('hidden');
  }
}

function updateConsumptionFromReadings(){
  const prev = Number(document.getElementById('prevReading').value) || 0;
  const curr = Number(document.getElementById('currReading').value) || 0;
  const diff = curr - prev;
  const valEl = document.getElementById('consumptionValue');
  const errEl = document.getElementById('readingError');

  if (diff < 0){
    valEl.textContent = '0';
    valEl.style.color = 'var(--danger)';
    errEl.textContent = '⚠️ لا يجوز أن تكون القراءة الحالية أقل من السابقة';
  } else {
    valEl.textContent = smartFmt(diff);
    valEl.style.color = 'var(--primary)';
    errEl.textContent = '';
  }
}

/* ============================================================
   دوال مساعدة (الحساب)
============================================================ */
const ArabicPeriodNames = ['', 'الأولى', 'الثانية', 'الثالثة', 'الرابعة', 'الخامسة', 'السادسة', 'السابعة', 'الثامنة', 'التاسعة', 'العاشرة'];

function getTierDisplayName(name){
  const n = parseInt(name);
  if (!isNaN(n) && n >= 1 && n <= 10) return ArabicPeriodNames[n];
  return name;
}

function smartFmt(val){
  const num = Number(val) || 0;
  if (Number.isInteger(num)) return num.toLocaleString('en-US');
  return num.toLocaleString('en-US', {minimumFractionDigits:1, maximumFractionDigits:2});
}
function parseDate(s){
  const parts = String(s).split('-');
  return { y: Number(parts[0])||2026, m: Number(parts[1])||1, d: Number(parts[2])||1 };
}
function mIdx(y,m){ return y*12+(m-1); }
function fmtDateAr(s){
  try{
    const {y,m,d} = parseDate(s);
    return new Date(y, m-1, d).toLocaleDateString('ar-EG',{day:'numeric',month:'long',year:'numeric'});
  }catch(e){ return s; }
}
function fmtMonthYear(y, m){
  const dt = new Date(y, m-1, 1);
  return dt.toLocaleDateString('ar-EG',{month:'long', year:'numeric'});
}

function numberToArabicWords(n){
  const num = Math.floor(Number(n) || 0);
  if (num === 0) return 'فقط صِفْرٌ\nجنيها مصريا فقط لاغير';
  const units = ['','مائة','مئتان','ثلاثمائة','أربعمائة','خمسمائة','ستمائة','سبعمائة','ثمانمائة','تسعمائة'];
  const tens  = ['','عشرة','عشرون','ثلاثون','أربعون','خمسون','ستون','سبعون','ثمانون','تسعون'];
  const teens = ['عشرة','أحد عشر','اثنا عشر','ثلاثة عشر','أربعة عشر','خمسة عشر','ستة عشر','سبعة عشر','ثمانية عشر','تسعة عشر'];
  const ones  = ['','واحد','اثنان','ثلاثة','أربعة','خمسة','ستة','سبعة','ثمانية','تسعة'];
  function less1000(val){
    if (val === 0) return '';
    let res = '';
    const h = Math.floor(val/100);
    const rem = val % 100;
    if (h > 0) res += units[h];
    if (rem > 0){
      if (res) res += ' و';
      if (rem < 10) res += ones[rem];
      else if (rem < 20) res += teens[rem-10];
      else{
        const t = Math.floor(rem/10);
        const o = rem % 10;
        if (o > 0) res += ones[o] + ' و';
        res += tens[t];
      }
    }
    return res;
  }
  function convert(val){
    if (val === 0) return '';
    if (val < 1000) return less1000(val);
    if (val < 1000000){
      const th = Math.floor(val/1000);
      const rem = val % 1000;
      let thStr = '';
      if (th === 1) thStr = 'ألف';
      else if (th === 2) thStr = 'ألفان';
      else if (th <= 10) thStr = less1000(th) + ' آلاف';
      else thStr = less1000(th) + ' ألفاً';
      if (rem > 0) thStr += ' و' + less1000(rem);
      return thStr;
    }
    return String(val);
  }
  return `فقط ${convert(num)}\nجنيها مصريا فقط لاغير`;
}

function monthlyCostDetailed(cons, tiers){
  let rem = Number(cons) || 0;
  let cost = 0;
  let prev = 0;
  const tableRows = [];
  if (!Array.isArray(tiers)) return { cost:0, rows:[] };
  for (let i=0; i<tiers.length; i++){
    if (rem <= 0) break;
    const t = tiers[i];
    let cap = (t.limit === null || t.limit === undefined || t.limit === '' || isNaN(t.limit)) ? rem : Math.max(0, Number(t.limit) - prev);
    const used = Math.min(rem, cap);
    const tierCost = used * (Number(t.price) || 0);
    cost += tierCost;
    if (used > 0){
      tableRows.push({
        tierName: `شريحة ${getTierDisplayName(t.name)}`,
        price: t.price,
        meters: used,
        total: tierCost
      });
    }
    rem -= used;
    if (t.limit !== null && t.limit !== undefined && t.limit !== '' && !isNaN(t.limit)){ prev = Number(t.limit); }
  }
  return { cost, rows: tableRows };
}

function calculateInternal(){
  if (inputMode === 'readings'){
    const prev = Number(document.getElementById('prevReading').value) || 0;
    const curr = Number(document.getElementById('currReading').value) || 0;
    if (curr < prev) return { error: 'reading_negative' };
  }
  if (!inputMode) return { error: 'no_mode' };
  const months = Number(document.getElementById('months').value) || 1;
  if (months < 1) return { error: 'months_invalid' };

  let cons = 0, prevReading = 0, currReading = 0;
  if (inputMode === 'readings'){
    prevReading = Number(document.getElementById('prevReading').value) || 0;
    currReading = Number(document.getElementById('currReading').value) || 0;
    cons = currReading - prevReading;
  } else {
    cons = Number(document.getElementById('consumption').value) || 0;
  }

  const avg = cons / months;
  const now = new Date();
  const targetDate = new Date(now.getFullYear(), now.getMonth() + 1, 1);
  const aEnd   = mIdx(targetDate.getFullYear(), targetDate.getMonth() + 1);
  const aStart = aEnd - months + 1;

  const endMonthName = targetDate.toLocaleDateString('ar-EG', {month:'long', year:'numeric'});
  const billPeriodText = `فاتورة شهر ${endMonthName}`;

  const sorted = [...periods].sort((a,b)=> a.date.localeCompare(b.date));
  let totalConsumptionCost = 0;
  const rows = [];
  let totalCovered = 0;

  for (let i=0; i<sorted.length; i++){
    const pDate = parseDate(sorted[i].date);
    const start = (i === 0) ? -Infinity : mIdx(pDate.y, pDate.m);
    const nextPDate = (i < sorted.length - 1) ? parseDate(sorted[i+1].date) : null;
    const end = nextPDate === null ? Infinity : mIdx(nextPDate.y, nextPDate.m) - 1;
    const s = Math.max(start, aStart);
    const e = Math.min(end, aEnd);
    const overlap = Math.max(0, e - s + 1);
    if (overlap === 0) continue;

    const res = monthlyCostDetailed(avg, sorted[i].tiers);
    const sub = overlap * res.cost;
    totalConsumptionCost += sub;
    totalCovered += overlap;

    const startYear = Math.floor(s/12), startMonth = (s % 12) + 1;
    const endYear = Math.floor(e/12), endMonth = (e % 12) + 1;

    rows.push({
      fromText: fmtMonthYear(startYear, startMonth), 
      toText: fmtMonthYear(endYear, endMonth),
      months: overlap, monthlyCost: res.cost, subtotal: sub,
      tierRows: res.rows, avg: avg
    });
  }

  const exactGrandTotal = totalConsumptionCost + fees;
  const grandTotal = Math.round(exactGrandTotal);
  const grandTotalWords = numberToArabicWords(grandTotal);

  return {
    months, cons, fees, avg, rows, inputMode, prevReading, currReading,
    totalConsumptionCost, grandTotal, exactGrandTotal, totalCovered, billPeriodText, grandTotalWords
  };
}

/* ============================================================
   زر الحساب وفتح النتيجة
============================================================ */
function performCalculation(){
  if (!inputMode){ alert('⚠️ يرجى اختيار طريقة إدخال الاستهلاك أولاً'); return; }
  if (inputMode === 'readings'){
    const prev = Number(document.getElementById('prevReading').value) || 0;
    const curr = Number(document.getElementById('currReading').value) || 0;
    if (curr < prev){ alert('⚠️ لا يجوز أن تكون القراءة الحالية أقل من السابقة'); return; }
  }
  const r = calculateInternal();
  if (r.error){ alert('⚠️ بيانات غير صحيحة'); return; }
  currentResult = r; // حفظ النتيجة
  showResult(r);
}

function toggleResultDetails(){
  const wrapper = document.getElementById('detailsWrapper');
  const btn = document.getElementById('toggleDetailsBtn');
  if (!wrapper || !btn) return;
  const isHidden = (wrapper.style.display === 'none');
  wrapper.style.display = isHidden ? 'block' : 'none';
  btn.textContent = isHidden ? '🔼 إخفاء التفاصيل' : '📋 عرض التفاصيل الكاملة';
}

/* ============================================================
   الأرشفة (حفظ الفاتورة والقراءة في قاعدة البيانات)
============================================================ */
async function saveToArchive(){
  if (!clientData){
    alert('⚠️ لا توجد بيانات عميل لربطها. هذه الميزة تعمل فقط عند فتح الحاسبة من التطبيق.');
    return;
  }
  if (!currentResult){
    alert('⚠️ يرجى حساب الفاتورة أولاً قبل الأرشفة.');
    return;
  }

  // تأكيد
  if (!confirm('هل تريد حفظ القراءة الحالية والفاتورة في الأرشيف؟\nسيتم اعتمادها كفاتورة الشهر القادم.')) return;

  try{
    // استيراد دالة قاعدة البيانات ديناميكياً (لأن الصفحة تعمل في iframe)
    const { put } = await import('../core/db.js'); // تأكد من المسار الصحيح
    
    const id = 'inv-' + Date.now();
    const invoiceData = {
      id: id,
      key: clientData.key, // مفتاح الشقة
      name: clientData.name,
      address: `قطاع ${clientData.sector} · بلوك ${clientData.blk} · عمارة ${clientData.bld} · شقة ${clientData.apt}`,
      prevReading: currentResult.prevReading,
      currReading: currentResult.currReading,
      consumption: currentResult.cons,
      totalAmount: currentResult.grandTotal,
      date: new Date().toISOString(),
      details: currentResult // لحفظ كل تفاصيل الحساب
    };

    // حفظ في قاعدة البيانات
    await put('invoices', id, invoiceData);
    
    alert('✅ تم حفظ الفاتورة والقراءة بنجاح في الأرشيف!');
    
    // إغلاق النافذة والعودة للتطبيق الأساسي
    if (window.parent && window.parent !== window) {
      window.parent.document.querySelector('dialog[open]')?.close();
    }
  }catch(err){
    console.error(err);
    alert('❌ حدث خطأ أثناء الحفظ: ' + err.message + '\nتأكد من وجود جدول invoices في قاعدة البيانات.');
  }
}

  let tableRows = '';

      </div>
    </div>`;

  const div = document.createElement('div');
  div.innerHTML = html;
