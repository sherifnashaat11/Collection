<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f2438">
<meta name="description" content="تطبيق محصّل الغاز — تحصيل فواتير الغاز ميدانياً">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<title>محصّل الغاز</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/collector.css">
</head>
<body>
<header class="top">
  <div class="header-top-row">
    <h1>محصّل الغاز</h1>
    <span class="app-version" id="appVersion">إصدار 1.0.0</span>
  </div>
  <div class="header-bottom-row">
    <button class="ico power-btn" aria-label="خروج" onclick="window.close();" title="خروج">⏻</button>
    <span class="pill" id="net">…</span>
    <button class="ico" id="ledgerBtn" aria-label="ما تم تحصيله" title="ما تم تحصيله" onclick="document.querySelector('#tabs button[data-t=\'ledger\']').click();">✅</button>
    <button class="ico" id="homeBtn" aria-label="التحصيل" title="التحصيل" onclick="document.querySelector('#tabs button[data-t=\'home\']').click();">📋</button>
    <button id="menuBtn" class="ico" aria-label="القائمة" hidden>⋮</button>
  </div>
</header>

<div id="menu" class="menu" hidden></div>

<main id="locked">
  <section class="card empty">
    <h2>🔒 التطبيق مقفل</h2>
    <p class="mute">افتحه ببصمتك أو النقش أو كلمة مرور الجهاز.</p>
    <div class="actions" style="justify-content:center">
      <button class="btn" id="unlockBtn">فتح</button>
      <button class="btn ghost" id="relogin">ادخل بكلمة السر</button>
    </div>
    <p class="mute" id="lmsg"></p>
  </section>
</main>

<main id="diag">
  <section class="card">
    <h2>⚠️ تعذر التحميل</h2>
    <p class="mute">لم يكتمل تحميل التطبيق. جرّب إعادة المحاولة، أو أرسل النص التالي للمطور:</p>
    <pre id="diagText" style="white-space:pre-wrap;font-size:.8rem;background:var(--paper-2);padding:.6rem;border-radius:8px;overflow:auto;max-height:200px;direction:ltr;text-align:left"></pre>
    <div class="actions">
      <button class="btn" id="retry">إعادة المحاولة</button>
      <button class="btn ghost" id="hardReset">مسح كل البيانات</button>
    </div>
  </section>
</main>

<main id="app" hidden>
  <section id="view"></section>
</main>

<nav class="tabs" id="tabs" hidden>
  <button data-t="home" class="on">التحصيل</button>
  <button data-t="ledger">ما تم تحصيله</button>
  <button data-t="search">بحث</button>
</nav>

<footer class="app-footer" id="footer" hidden>
  <span>تطوير: <b>شريف نشأت</b></span>
  <span> · </span>
  <span>الإصدار: <b>1.0.0</b></span>
</footer>

<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  var diagEl = document.getElementById('diag');
  var diagText = document.getElementById('diagText');
  var lockedEl = document.getElementById('locked');
  var appEl = document.getElementById('app');
  var tabsEl = document.getElementById('tabs');
  var footerEl = document.getElementById('footer');

  function showDiag(msg){
    appEl.hidden = true;
    tabsEl.hidden = true;
    if (footerEl) footerEl.hidden = true;
    diagEl.setAttribute('data-show', '1');
    diagText.textContent = String(msg);
  }

  window.addEventListener('error', function(e){
    showDiag('JS error: ' + e.message + '\n' + (e.filename||'') + ':' + (e.lineno||''));
  });
  window.addEventListener('unhandledrejection', function(e){
    showDiag('Promise: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
  });

  setTimeout(function(){
    if (!appEl.hidden) return;
    if (lockedEl.getAttribute('data-show') === '1') return;
    if (diagEl.getAttribute('data-show') === '1') return;
    showDiag('لم يبدأ التطبيق بعد 5 ثوانٍ.\nتأكد من رفع js/collector/app.js وأن الإنترنت يعمل.');
  }, 5000);

  document.getElementById('retry').onclick = function(){ location.reload(); };
  document.getElementById('hardReset').onclick = function(){
    if (!confirm('سيُمسح كل شيء (بيانات الدخول، الملفات، التحصيلات). هل أنت متأكد؟')) return;
    (async function(){
      try{
        var dbs = await indexedDB.databases();
        for (var i=0;i<dbs.length;i++){ if (dbs[i].name) indexedDB.deleteDatabase(dbs[i].name); }
      }catch(e){}
      try{ localStorage.clear(); }catch(e){}
      try{
        var ks = await caches.keys();
        await Promise.all(ks.map(function(k){ return caches.delete(k); }));
      }catch(e){}
      try{
        var rs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(rs.map(function(r){ return r.unregister(); }));
      }catch(e){}
      location.reload();
    })();
  };

  var s = document.createElement('script');
  s.type = 'module';
  s.src = 'js/collector/app.js';
  s.onerror = function(){ showDiag('فشل تحميل js/collector/app.js\nتأكد أن الملف موجود في المستودع.'); };
  document.body.appendChild(s);
})();
</script>
</body>
</html>
